[package]
name = "matheus010509/chefbook"
version = "0.1.3"
description = "ChefBook"
private = true

[dependencies]
"php/php" = "^8.3.400"

[fs]
"/app/" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
